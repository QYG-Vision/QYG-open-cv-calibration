# 测试专用配置文件 —— 使用 IMG 设备读取离线数据
# 此文件的路径上下文中，IMG.images_path 相对路径会基于此文件所在目录解析
# 即 tests/data/

device: IMG

calibrateCamera_flags: 0x00080

pattern: chessboard
pattern_rows: 8
pattern_cols: 8
square_size: 35

IMG:
  images_path: ./handeye_calib_data

camera_matrix: [1794.49442,    0.     ,  697.2378 ,
                0.     , 1792.71358,  574.26992,
                0.     ,    0.     ,    1.     ]
distort_coeffs: [-0.084663, 0.154439, 0.000893, -0.000966, 0.000000]

Serial:
  port_name: /dev/null
  baud_rate: 115200

camera_calib_save_path: ./test_output/camera_calib_images
handeye_calib_save_path: ./test_output/handeye_calib_data

auto_collect_enabled: false
auto_collect_interval_ms: 50
auto_collect_param_distance: 0.2
auto_collect_param_ranges: [0.7, 0.7, 0.4, 0.5]
auto_collect_goodenough_samples: 40
auto_collect_max_chessboard_speed: -1.0
auto_collect_sharpness_threshold: 0.0
